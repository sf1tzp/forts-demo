# HTTPRoute for podinfo, as `fort add` renders it from the chart
# contract's http block (podinfo:9898) and the fort's hostname
# convention; attaches to the listener added by
# ../gateway/listener-podinfo.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: podinfo
spec:
  parentRefs:
    - name: edge
      namespace: traefik
      sectionName: https-podinfo
  hostnames:
    - podinfo.outpost.forts-demo.mesh
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898
