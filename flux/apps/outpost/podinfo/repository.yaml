# podinfo's chart as a single-chart OCI artifact (OCIRepository +
# HelmRelease.chartRef, ref.tag pinned = chart version). Published by the
# app repo's release workflow; Renovate's flux manager tracks ref.tag for
# bump PRs.
#
# No certSecretRef here: ghcr.io is a public registry with a public CA,
# and certSecretRef REPLACES the system roots — handing it the estate's
# step-ca root makes source-controller refuse ghcr.io. The CA machinery
# `fort add` renders serves the estate's private registry only.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/stefanprodan/charts/podinfo
  ref:
    tag: "6.17.0"
