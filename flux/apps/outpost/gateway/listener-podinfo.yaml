# https listener for podinfo — appended to the Gateway by the patch
# entry in kustomization.yaml. The hostname follows the fort's convention
# <app>.<fort>.forts-demo.mesh; the certificate is certificate-podinfo.yaml.
- op: add
  path: /spec/listeners/-
  value:
    name: https-podinfo
    port: 8443
    protocol: HTTPS
    hostname: podinfo.outpost.forts-demo.mesh
    tls:
      mode: Terminate
      certificateRefs:
        - name: podinfo-tls
    allowedRoutes:
      namespaces:
        from: All
