apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
  - redirect-https.yaml
  - certificate-grafana.yaml
# One JSON6902 patch per service appends its https listener to the
# Gateway: listeners live in a single object, and a strategic-merge
# patch cannot append to a CRD list.
patches:
  - path: listener-grafana.yaml
    target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: homelab
      namespace: traefik
