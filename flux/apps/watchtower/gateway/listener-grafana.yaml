# https listener for grafana.watchtower.forts-demo.mesh — appended to the Gateway by the patch
# entry in kustomization.yaml; the certificate is certificate-grafana.yaml,
# the route is in ../monitoring-central/. fort monitoring scaffold watchtower wrote it.
- op: add
  path: /spec/listeners/-
  value:
    name: https-grafana
    port: 8443
    protocol: HTTPS
    hostname: grafana.watchtower.forts-demo.mesh
    tls:
      mode: Terminate
      certificateRefs:
        - name: grafana-tls
    allowedRoutes:
      namespaces:
        from: All
