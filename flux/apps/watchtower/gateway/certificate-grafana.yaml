# Serving cert for the https-grafana listener of the monitoring hub's
# stack (fort-layers; flux/apps/watchtower/monitoring-central/), issued by
# the estate's ClusterIssuer letsencrypt — the one the Gateway's other
# certificates name. The hostname must resolve to this fort in the DNS
# the issuer dials back through; until it does, cert-manager retries
# harmlessly. fort monitoring scaffold watchtower wrote it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana
  namespace: traefik
spec:
  secretName: grafana-tls
  dnsNames:
    - grafana.watchtower.forts-demo.mesh
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
