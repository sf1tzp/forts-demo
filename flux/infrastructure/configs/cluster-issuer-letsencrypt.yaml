# The estate's ACME issuer (#43). The estate was init'd with no [acme]
# table, so `fort init` rendered no issuer; this file is the hand edit
# that adds one, pointed at the lab's private step-ca (step-ca.lofi on
# soundship) instead of Let's Encrypt — a public issuer cannot validate
# a .mesh name. The name stays `letsencrypt`: it is the contract every
# scaffolded Certificate references.
#
# The http01 gateway solver: challenge routes attach to the per-cluster
# Gateway's http listener. step-ca dials the hostname back through the
# lab DNS, which answers the fort's LAN address.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://step-ca.lofi:9000/acme/acme/directory
    email: tech@stev.lol
    # The step-ca's TLS trust, in-cluster: the root from
    # nixos/certs/ca-root.pem, base64. Rotate both together.
    caBundle: 
    privateKeySecretRef:
      name: letsencrypt-acme-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: edge
                namespace: traefik
